name: Build Tachiyomi Lite APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apply_lite.py
      - tests/**
      - .github/workflows/build-tachiyomi-lite.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Check out Lite overlay
        uses: actions/checkout@v4
        with:
          path: lite

      - name: Check out reviewed Mihon source
        uses: actions/checkout@v4
        with:
          repository: mihonapp/mihon
          ref: 0c55527206d5b253c58a2428cfebeed10b249571
          path: mihon
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: mihon/**/*.gradle*

      - name: Verify Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Test Lite source overlay
        run: python3 -m unittest discover -s tests -v
        working-directory: lite

      - name: Check and apply Lite changes
        run: |
          python3 lite/apply_lite.py mihon --check
          python3 lite/apply_lite.py mihon

      - name: Compile standard debug APK
        run: |
          chmod +x gradlew
          # The default services.gradle.org URL can time out or return 504.
          # Use Gradle's official direct distribution endpoint and retry transient failures.
          echo 'networkTimeout=120000' >> gradle/wrapper/gradle-wrapper.properties
          sed -i 's@services.gradle.org/distributions@downloads.gradle.org/distributions@' gradle/wrapper/gradle-wrapper.properties
          for attempt in 1 2 3; do
            ./gradlew :app:assembleDebug --no-daemon --stacktrace && exit 0
            echo "Gradle attempt $attempt failed"
            sleep 15
          done
          exit 1
        working-directory: mihon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: tachiyomi-lite-v0.1-debug-apk
          path: mihon/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
