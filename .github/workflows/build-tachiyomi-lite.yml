name: Build Tachiyomi Lite APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apply_lite.py
      - tests/**
      - .github/workflows/build-tachiyomi-lite.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Check out Lite overlay
        uses: actions/checkout@v4
        with:
          path: lite

      - name: Check out reviewed Mihon source
        uses: actions/checkout@v4
        with:
          repository: mihonapp/mihon
          ref: 0c55527206d5b253c58a2428cfebeed10b249571
          path: mihon
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: mihon/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Test Lite source overlay
        run: python3 -m unittest discover -s tests -v
        working-directory: lite

      - name: Check and apply Lite changes
        run: |
          python3 lite/apply_lite.py mihon --check
          python3 lite/apply_lite.py mihon

      - name: Compile standard debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug --no-daemon --stacktrace
        working-directory: mihon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: tachiyomi-lite-v0.1-debug-apk
          path: mihon/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14
